name: image

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

env:
  # The ML image's base, pinned by digest like the Dockerfile's default (README, CI).
  ML_BASE: freqtradeorg/freqtrade:2026.9_freqai@sha256:a98dc1ca26d47a3fb01b916dfdee97b087bf9924cd6ce325bebb35a2722af746

jobs:
  # gitleaks over the commits this push or PR adds. History before 2026-11 holds freqtrade API
  # JWTs in old committed logs and a retired jwt_secret_key, none of it in HEAD (README, CI), so
  # a full-history scan here would always be red.
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks over the new commits
        env:
          RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || format('{0}..{1}', github.event.before, github.sha) }}
        run: |
          case "$RANGE" in 0000000000000000000000000000000000000000..*) RANGE="-1 $GITHUB_SHA";; esac
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.28.0@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854 \
            git /repo --log-opts="$RANGE" --redact --no-banner

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install static check tools
        run: python -m pip install -r lab/requirements-dev.txt
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: trader
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build
        run: docker build -t trader:ci .
      - name: Migrate twice, then unit and database tests
        timeout-minutes: 10
        run: |
          test_command=$(node -p 'require("./package.json").scripts.test')
          docker run --rm --network host --entrypoint bash \
            -e DATABASE_URL=postgresql://postgres:test@localhost:5432/trader trader:ci \
            -c "python lab/migrate.py && python lab/migrate.py | grep -q '0 new' && $test_command"
      - name: Every strategy loads, the staged families in lab/families too
        run: |
          docker run --rm --entrypoint freqtrade trader:ci list-strategies --recursive-strategy-search \
            --strategy-path /repo/lab/families --userdir /repo/user_data -c /repo/user_data/config.base.json -c /repo/user_data/exchanges/binanceus.json \
            | tee strategies.txt
          ! grep -E 'LOAD FAILED|DUPLICATE' strategies.txt

  test-ml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the ML image (freqtrade's _freqai base, for lightgbm)
        run: docker build --build-arg FREQTRADE_IMAGE=$ML_BASE -t trader-ml:ci .
      - name: FreqAI trains and predicts; the families still load and shadow nothing
        timeout-minutes: 10
        run: >-
          docker run --rm --entrypoint python trader-ml:ci
          -m pytest -q -p no:cacheprovider lab/tests/test_ml.py lab/tests/test_families.py

  publish:
    needs: [secrets, quality, test, test-ml]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      ml-digest: ${{ steps.build-ml.outputs.digest }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/kblack0610/trader
          tags: |
            type=sha,format=short
            type=raw,value=latest
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: REVISION=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - id: meta-ml
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/kblack0610/trader-ml
          tags: |
            type=sha,format=short
            type=raw,value=latest
      - id: build-ml
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            FREQTRADE_IMAGE=${{ env.ML_BASE }}
            REVISION=${{ github.sha }}
          tags: ${{ steps.meta-ml.outputs.tags }}
          labels: ${{ steps.meta-ml.outputs.labels }}
          cache-from: type=gha,scope=ml
          cache-to: type=gha,mode=max,scope=ml

  # Opens the home-config PR that pins this build's trader and trader-ml digests
  # (apps/freqtrade/kustomization.yaml, images: trader and trader-ml) and closes the one it
  # supersedes. Merging that PR on Forgejo is the deploy.
  bump-home-config:
    needs: publish
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency: home-config-bump
    steps:
      - uses: actions/checkout@v4
      - name: Open the digest-bump PR on Forgejo
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_DEPLOY_TOKEN }}
          DIGEST: ${{ needs.publish.outputs.digest }}
          ML_DIGEST: ${{ needs.publish.outputs.ml-digest }}
          SUBJECT: ${{ github.event.head_commit.message }}
        run: |
          if [ -z "$FORGEJO_TOKEN" ]; then
            echo "::warning::FORGEJO_DEPLOY_TOKEN is not set, so no home-config bump PR was opened (README, CI)"
            exit 0
          fi
          tip=$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}" refs/heads/master | cut -f1)
          if [ "$tip" != "$GITHUB_SHA" ]; then
            echo "master moved on to ${tip:0:7}; that build opens the bump"
            exit 0
          fi
          python3 ci/bump_home_config.py
