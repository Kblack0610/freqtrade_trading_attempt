<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}trader{% endblock %} - trader</title>
<link rel="stylesheet" href="/static/kit/tokens.css">
<link rel="stylesheet" href="/static/kit/shell.css">
<link rel="stylesheet" href="/static/style.css">
<script type="module" src="/static/kit/kb-shell.js"></script>
<script src="/static/htmx.min.js" defer></script>
</head>
<body>
<kb-shell>
  <a class="kb-brand" href="/">trader</a>
  {% if user %}
  <nav class="kb-nav" aria-label="Sections">
    {% for g in nav_groups(request.url.path) %}
    <div class="kb-group">{{ g.name }}</div>
    {% for t in g.tabs %}<a href="{{ t.path }}" {% if t.current %}aria-current="page"{% endif %}>{{ t.title }}</a>
    {% endfor %}{% endfor %}
    <form class="kb-foot" method="post" action="/logout"><span class="muted">{{ user }}</span> <button type="submit">Sign out</button></form>
  </nav>
  {% endif %}
</kb-shell>
<main class="kb-main">
{% block body %}{% endblock %}
</main>
<footer class="kb-main muted">Dry run only: no real money, no trade controls. Times in {{ tz }}.</footer>
</body>
</html>
