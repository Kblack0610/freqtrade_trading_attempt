checks = [{source = "broker", match = "polymarket_us", max_age_h = 3}]
human = "Nothing: the account is open (2026-11-12) and its read key is in SOPS trader-brokers as POLYMARKET_US_KEY_ID and POLYMARKET_US_SECRET_KEY"

