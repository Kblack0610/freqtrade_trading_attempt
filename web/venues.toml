checks = [{source = "drill", match = "manifold", max_age_h = 96}]
human = "Create a Manifold API key (tr-118); it goes in SOPS for the drill CronJob"

[[venue]]
name = "Trezor"
money = "real, watch only"
checks = [{source = "wallet", match = "*", max_age_h = 48}]
human = "Export each account's public key (xpub) from Trezor Suite for WALLET_ACCOUNTS (docs/platforms.md, Trezor)"

[[venue]]
name = "Polymarket US"
