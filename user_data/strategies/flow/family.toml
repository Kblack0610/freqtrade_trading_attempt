# The volume-flow family: volume leading price, read from OHLCV alone (spot, no order book), all with the same fixed
# exit. Signals are lab/channels.py. Long only, spot.
# lab/families/generate.py writes the strategy files from this file: edit here, then rerun it.
kind = "signal"
module = "channels"
title = "Volume-flow"
prefix = "Flow"
timeframe = "1h"
ladder = ["15m", "1h", "4h", "1d"]  # holding period is a diversity axis (docs/strategy-coverage.md); generate.py scales the exit per rung
startup_candle_count = 100

[exit]
minimal_roi = { "0" = 0.06, "1440" = 0.03 }
stoploss = -0.04
time_stop_hours = 72

# An up candle closing in its top quarter on three times its usual volume.
[strategies.Surge]
call = "volume_surge"
args = { window = 48, ratio = 3.0 }

# On-balance volume at a new 50-bar high while the close is not.
[strategies.Obv]
call = "obv_break"
args = { window = 50 }
