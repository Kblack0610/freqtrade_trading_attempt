# Tuning for lab/markets/. Facts behind each number: docs/markets.md.

[recorder]
# Bucket and prefix of the change-only quote parquet; the endpoint and keys come from the environment
# (S3_ENDPOINT, S3_ACCESS_KEY, S3_SECRET_KEY). Objects: <prefix>/venue=<v>/date=<YYYY-MM-DD>/<HHMMSSZ>.parquet
bucket = "trader-markets"
prefix = "quotes"
# The first run with no earlier sweep reads resolutions this far back; later runs overlap the last one by this.
resolutions_lookback_h = 1
# What a run with no venue named sweeps. The 5-min CronJob runs it bare, so a venue joins here only once its sweep
# fits that cadence alongside Kalshi's 3 to 4.5 min; the others run by name (python -m lab.markets.recorder manifold).
default_venues = ["kalshi"]

[compact]
# python -m lab.markets.compact (lab/markets/compact.py) folds a venue-day's parts into <prefix>/venue=<v>/date=<d>/day.parquet
# once the day ended this long ago; a sweep runs under 15 min (the CronJob's deadline), so 1 h leaves no writer behind.
grace_h = 1

[history]
# python -m lab.markets.history (lab/markets/history.py). Objects: <recorder bucket>/<prefix>/<job>/venue=<v>/date=<d>.parquet
prefix = "history"
# A run stops between pages (settled) or settle dates (bars, trades) once it has taken this long; the next resumes.
budget_min = 50
# What a job with no venue named runs. PredictIt states no results and the Odds API sells history only on paid
# plans, so neither is here (docs/markets.md).
settled_venues = ["kalshi", "polymarket_us", "polymarket", "manifold"]
bars_venues = ["kalshi", "polymarket_us", "polymarket"]
trades_venues = ["kalshi"]

[history.kalshi]
# 0.5 s paces the recorder's list sweep; history makes one call a market, and 0.15 s keeps it with the recorder
# under the Basic tier's 20 requests/s.
page_gap_s = 0.15
# Kalshi settles about 70k markets a day and 80% trade under 100 contracts: those never reach bars or trades.
settled_min_volume = 100
bars_period_min = 60
# Contracts traded over the market's life. Below 100 there is no real quote to backtest against.
bars_min_volume = 100
bars_since_days = 1095
# Trades are what the fill model is fitted on, and Kalshi prints millions a day: the liquid markets of the last 90 days.
trades_min_volume = 10000
trades_since_days = 90

[history.polymarket_us]
# The venue keeps 45 days, and its list carries no volume, so every settled market in that window.
bars_period_min = 60
bars_min_volume = 0
bars_since_days = 45

[history.polymarket]
# volumeNum is dollars traded.
bars_period_min = 60
bars_min_volume = 1000
bars_since_days = 1095

[venues.kalshi]
title = "Kalshi"
kind = "exchange"
url = "https://kalshi.com"
base_url = "https://api.elections.kalshi.com/trade-api/v2"
page_limit = 1000
# An unpaced count of /markets drew 429s; 0.5 s between pages was clean (docs/markets.md, Rate limits).
page_gap_s = 0.5
retries = 6
timeout_s = 30

[venues.polymarket_us]
title = "Polymarket US"
kind = "exchange"
url = "https://polymarket.us"
base_url = "https://gateway.polymarket.us"
# The list caps a page at 500. The public gateway allows 20 requests/s per IP (docs/markets.md, Polymarket US).
page_limit = 500
page_gap_s = 0.1
retries = 6
timeout_s = 30

[venues.polymarket]
# Global prices, read-only: a US resident may not trade this book.
title = "Polymarket (global)"
kind = "exchange"
url = "https://polymarket.com"
base_url = "https://gamma-api.polymarket.com"
# /markets/keyset caps a page at 100; Gamma /markets allows 300 requests per 10 s.
page_limit = 100
page_gap_s = 0.1
retries = 6
timeout_s = 30

[venues.predictit]
title = "PredictIt"
kind = "exchange"
url = "https://www.predictit.org"
base_url = "https://www.predictit.org/api"
# One request a sweep; the snapshot refreshes about once a minute, so poll no faster.
page_gap_s = 1
retries = 4
timeout_s = 30

[venues.manifold]
title = "Manifold"
kind = "play-money"
url = "https://manifold.markets"
base_url = "https://api.manifold.markets"
# search-markets caps a page at 1000; 500 requests/min per IP.
page_limit = 1000
page_gap_s = 0.2
retries = 6
timeout_s = 60

[venues.odds_api]
# Sportsbook implied odds, read-only; the key comes from ODDS_API_KEY. Credits a run: per sport, 1 per region for the
# odds plus 2 for /scores. One sport every 5 min is about 8,600 a month against the free tier's 500, so the cadence
# and the sports list wait on the plan the human buys (docs/markets.md, The Odds API).
title = "The Odds API"
kind = "sportsbook"
url = "https://the-odds-api.com"
base_url = "https://api.the-odds-api.com"
sports = ["basketball_nba"]
regions = "us"
page_gap_s = 1
retries = 4
timeout_s = 30

[links.rules.kalshi_game]
# The odds_api sport key and the Kalshi game-winner series it links to.
series = { basketball_nba = "KXNBAGAME", americanfootball_nfl = "KXNFLGAME", icehockey_nhl = "KXNHLGAME", baseball_mlb = "KXMLBGAME" }

[links.llm]
# Proposals only, through the LiteLLM gateway with a scoped key (LITELLM_API_KEY). A local model: free, and the
# market titles never leave the house.
base_url = "https://llm.kblab.me"
model = "reasoning (Qwen3.6-35B-A3B-4bit)"
timeout_s = 120
# Each [a, b]: open markets of a that are not yet linked or asked about, each asked against b's candidates.
pairs = [["odds_api", "kalshi"], ["polymarket_us", "kalshi"]]
# Markets asked about per run, across all pairs, soonest closing first, and only those closing within horizon_d.
max_asks = 50
horizon_d = 14
# A candidate closes within window_h of the market and shares a title word; the best `candidates` by shared words go.
window_h = 96
candidates = 15
stopwords = ["will", "the", "win", "wins", "winner", "at", "vs", "and", "or", "of", "in", "on", "to", "a", "by", "be", "game", "match", "yes", "no", "2026", "2027"]

[backtest]
# lab/markets/backtest.py. Results are scored with suggest.toml [confidence], the crypto lab's own bar.
# Daily returns chain on this wallet, as the crypto backtests' 1000 USD.
wallet = 1000
# An order meets the book as it stood this long after the row that prompted it. The recorder sweeps every 5 min
# and bars are hourly, so on today's data this rarely moves a fill; it matters once the websocket feeds (tr-50).
latency_s = 2
# An order takes at most this share of the top-of-book size on its side; the rest is cancelled, never walked
# up the book, because only the top is recorded.
depth_share = 0.5
# Bars carry no sizes: each side's depth is this share of the contracts the period traded.
bar_volume_share = 0.1

# Fees per venue (lab/markets/fees.py; facts in docs/markets.md, Fees). A venue with no table costs nothing.
[backtest.fees.kalshi]
# ceil(0.07 * C * P * (1 - P)) up to the cent per order. The maker rate is not modelled: every fill here is a taker.
kind = "pq"
rate = 0.07
rounding = "ceil"

[backtest.fees.polymarket_us]
kind = "pq"
rate = 0.0695
rounding = "half_even"

[backtest.fees.polymarket]
# The rate is by category and the markets table holds none, so the highest (crypto 0.07). Read-only: no US trading.
kind = "pq"
rate = 0.07
rounding = "none"

[backtest.fees.predictit]
# 10% of the profit on a winning position, nothing on entry.
kind = "profit"
share = 0.10
rounding = "none"

[families]
# python -m lab.markets.families <family> (lab/markets/families.py). Each family below is a grid: a list is an axis, a
# list of tables merges each table into the variant, anything else is fixed. Every variant is a trial, and the
# deflated Sharpe counts them all, so an axis is added only when its answer would change what trades.
# The window when no --start is given: this many days before --end.
days = 90

[families.longshot]
# Favourite-longshot bias: longshots are bought too dear and favourites too cheap. Buy one side of every market
# whose yes mid sits in the band, within `hours` of close.
stake = 10
max_spread = 0.05
hours = [24, 168]
bands = [{ buy = "no", lo = 0.01, hi = 0.10 }, { buy = "no", lo = 0.10, hi = 0.20 },
         { buy = "yes", lo = 0.80, hi = 0.90 }, { buy = "yes", lo = 0.90, hi = 0.99 }]

[families.calibration]
# Base rates: how often markets entered this way resolved yes over the `train_days` before the window, per price
# bucket of `width`, across the venue (all) or per series; `prior` markets shrink a thin bucket toward its own
# price, and a bucket under `min_n` markets is not traded. Trade when the rate beats the price by `edge`; the
# edge has to cover the fee, about 1.75c a contract at 50c on Kalshi.
stake = 10
max_spread = 0.05
hours = 168
width = 0.05
prior = 10
min_n = 30
train_days = 30
key = ["all", "series"]
edge = [0.03, 0.06]

[families.gap]
# Cross-venue gaps against a reference venue's fair price, over the links one rule made (market_links). One
# source a variant, so results are read per link source; LLM links are refused (lab/markets/families.py).
stake = 10
max_spread = 0.05
ref_venue = "odds_api"
source = ["rule:kalshi_game"]
edge = [0.03, 0.06]

[families.llm]
# The forecaster is forward only: backtest.replay refuses any book that starts before this, the model's training
# cutoff. The model's own cutoff is not published, so this is the day forward scoring starts, which is no earlier.
cutoff = 2026-11-06T00:00:00Z
stake = 10
max_spread = 0.05
hours = 168
edge = 0.06

[paper]
# python -m lab.markets.paper (lab/markets/paper.py): each variant of each family here is one paper account. Only families
# that need no fit and no key run here (lab/markets/paper.py docstring); the recorder's books are Kalshi only.
venues = ["kalshi"]
families = ["longshot"]
capital = 1000
# Only markets closing within this many hours are shown to the league: the longest `hours` any family trades.
horizon_h = 168
# No entries when the venue's last good sweep is older than this: three missed 5-min sweeps.
max_book_age_min = 15

[demo.kalshi]
# lab/markets/kalshi_trade.py, mock funds only: the client refuses any host but the demo's (docs/markets.md, Kalshi).
# Keys are the demo account's, apart from production: KALSHI_DEMO_KEY_ID and KALSHI_DEMO_KEY_FILE (a PEM).
base_url = "https://external-api.demo.kalshi.co/trade-api/v2"
timeout_s = 30
# The drill rests one contract this far below the ask, post only, so it cannot fill before it is cancelled.
drill_price = 0.01

[demo.manifold]
# lab/markets/manifold_trade.py, play money: the client refuses any host but api.manifold.markets. Key: MANIFOLD_API_KEY.
base_url = "https://api.manifold.markets"
timeout_s = 30
# The drill rests a 1-mana YES limit bet (the minimum bet) at 1%, the lowest limit, on a market priced at min_prob or
# more, so it cannot fill before it is cancelled. Manifold cancels it on its own after expires_s if the drill dies.
drill_price = 0.01
drill_mana = 1
min_prob = 0.10
expires_s = 600
