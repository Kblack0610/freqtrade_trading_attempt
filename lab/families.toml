# Which method family each strategy belongs to, and what data it reads. /coverage (web/app.py) joins this to the
# results tables to show which families have been tested where. Keyed by strategy class name, not file name.
# Classified from each file's entry rule. A `note` marks a call that could reasonably go another way.
# A new strategy file shows on /coverage as untagged until it gets a line here; lab/tests/test_web.py checks
# that every class under user_data/strategies has one.

# Family order on /coverage, with what puts a strategy in it.
[families]
trend = "Enters with the trend: a moving-average cross, MA ordering, Supertrend or ADX direction."
mean-reversion = "Buys a dip: oversold RSI, MFI, CCI or stochastics, or a close under a lower Bollinger band."
momentum = "Buys strength: MACD above its signal or zero, rising closes, positive momentum."
breakout = "Buys a price pushing through a level."
candlestick-pattern = "Enters on a candle or count pattern."
time-based = "Enters by the clock."
grid = "Buys layers on a ladder under a range and sells each one a step higher."
dca = "Averages down: a base order, then larger safety orders lower, one take profit on the average."
relative-value = "Buys a coin cheap against another (its ratio to BTC), the long leg of a pair trade."
exit-example = "A Freqtrade example of an exit or stoploss hook; the entry is a placeholder."
template = "A sample or no-op strategy, kept as a reference, not a method."
biased-control = "Known lookahead bias; kept so the bias check has something to catch. Its results are void."
short = "Shorts on futures; research only, outside user_data/strategies."

[strategies]
