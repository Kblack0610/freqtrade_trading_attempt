# Job name -> the commands a pod runs, so home-config names jobs and never module paths.
# `python -m lab run <job>` runs each step in order as `python -m <step>` (cwd /repo), always all of them, and exits
# with the first nonzero code. The last step replaces the runner (exec) when every step before it passed, so a one-step
# job is PID 1 in its pod and gets the pod's SIGTERM itself, as the module path command did (the league's freqtrade).
# A job written { steps = [...], stop_on_failure = true } stops at its first failing step instead, like `a && b`.
# A step may name an env var ($WF_EXCHANGES); it is expanded before the step is split.
# Moving a module changes this file and nothing in home-config.

[jobs]
migrate = ["lab.migrate"]
watcher = ["lab.money.watcher"]
league = ["lab.crypto.league"]
# Listings after the backfill: its data_coverage prune drops the delisted series, which the second step records again.
backfill = ["lab.crypto.backfill", "lab.crypto.listings"]
ingest = ["lab.crypto.ingest"]
analysis = ["lab.crypto.analyze"]
# A failed candle fetch must not start a walk-forward on an empty disk.
walkforward = { steps = ["lab.crypto.snapshot fetch $WF_EXCHANGES", "lab.crypto.walkforward"], stop_on_failure = true }
snapshot-publish = ["lab.crypto.snapshot publish"]
# Funding first, then the paper pass that trades on it: the pass runs even when the funding fetch failed.
futures = ["lab.futures.funding", "lab.futures.paper"]
calibration = ["lab.crypto.calibration"]
call-rules = ["lab.inputs.call_rules"]
wallet = ["lab.money.wallet"]
nws = ["lab.inputs.nws"]
stocks = ["lab.stocks.paper"]
broker-read = ["lab.money.broker read"]
broker-drill = ["lab.money.broker drill"]
kalshi-drill = ["lab.events.kalshi_trade drill"]
manifold-drill = ["lab.events.manifold_trade drill"]
markets-links = ["lab.events.links"]
markets-families = ["lab.events.families"]
markets-compact = ["lab.events.compact"]
markets-history-settled = ["lab.events.history settled"]
markets-history-bars = ["lab.events.history bars"]
markets-history-trades = ["lab.events.history trades"]
# A recorder sweep, then the paper pass on the same venue: the pass runs even when the sweep failed.
markets-recorder = ["lab.stages.recorder", "lab.events.paper"]
markets-recorder-polymarket-us = ["lab.stages.recorder polymarket_us", "lab.events.paper --venue polymarket_us"]
markets-recorder-predictit = ["lab.stages.recorder predictit", "lab.events.paper --venue predictit"]
markets-recorder-polymarket = ["lab.stages.recorder polymarket"]
markets-recorder-manifold = ["lab.stages.recorder manifold"]
markets-recorder-odds-api = ["lab.stages.recorder odds_api"]
