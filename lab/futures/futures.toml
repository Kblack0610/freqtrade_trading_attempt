# The futures league (lab/futures/paper.py): paper accounts long or short on the okx and kucoin perpetual swaps whose funding
# lab/futures/funding.py records, one per family variant below. Quotes are read by GET from the exchange's public ticker and
# nothing is sent to an order API. A grid is lab/core/grid.py's: a list is an axis.

venues = ["okx", "kucoin"]   # funding_rates.exchange values the league trades

[paper]
capital = 10000.0       # each account's paper capital, USD
stake = 1000.0          # USD notional per entry, unlevered: the cash it ties up is its notional
max_open = 4            # open positions an account holds at most
taker_bps = 5           # each side's fee on its notional
max_quote_age_min = 5   # a quote older than this is not a price
max_spread_bps = 10     # the spread over the mid an entry or exit accepts
max_funding_age_h = 12  # the funding rate an entry reads is at most this old
max_mark_age_h = 30     # the pass runs daily after funding.py: an account unmarked this long is stale (web/lanes.py, web/exporter.py)
trace_days = 30         # near-miss decisions and funnel rows older than this are cut
near_misses = 2         # near-miss decisions kept per account per pass (one check failed)

# Funding: go short a swap whose latest funding rate is at least `threshold` (longs pay it), long one at or below its negative,
# and close after `hold_hours`. Every funding settlement in between is charged to the position.
[families.funding]
threshold = [0.0001, 0.0003]
hold_hours = 24

# The futures gate (lab/futures/gate.py): the research backtests of `strategies` (lab/futures/research/bust.py), each trade net
# of the venue's recorded funding, cut into windows and judged by the suggest.toml [confidence] thresholds.
[gate]
strategies = ["DonchianLongShort", "CarverLongShort64", "CarverLongShort16"]
trial_strategies = ["BustShort", "DonchianLongShort", "CarverLongShort64", "CarverLongShort16"]  # their trial register rows
window_days = 30        # one window per month of trades, as the walk-forward months gate reads them
lockbox_windows = 3     # the newest windows, read only by a strategy passing every other gate
pbo_blocks = 4          # the strategies rank against each other over this many blocks
