# Setup overlays: account settings lab/analyze.py backtests every strategy x venue under, beside the strategy as it
# stands. Each [overlays.<group>] table is a grid (lab/grid.py: a list is an axis, a list of tables merges each table
# in), and every params dict it expands to is one overlay, named by its content (lab/variants.py), so renaming a group
# or moving an overlay between groups changes nothing. Every strategy x venue x overlay with a window is one row in the
# trial register, so each overlay added raises the deflated-Sharpe bar for everything (README, Setup overlays).
#
# Keys an overlay may set, each overriding the config or the strategy's own attribute:
#   max_open_trades  open trades at once (config.base.json: 3)
#   stake_amount     USD per trade, or "unlimited" (the base: the wallet split across open trades)
#   stoploss         a negative ratio, for example -0.10
#   minimal_roi      a table of minutes -> ratio, for example { "0" = 0.05 }
#   pairs            trade only the first N pairs of the venue's whitelist, in its file order
# Anything else, dry_run and exchange keys included, is refused (lab/variants.py ALLOWED).
#
# The grid is also the spawn of shadow paper accounts (lab/shadow.py): every overlay series with a 365-day window is a
# candidate, so a group added here widens what the loop can promote. Keep every overlay already run: one taken out
# takes its stored chunks with it (lab/analyze.py sync_overlays), and an id is its content, so editing a value is a
# removal plus an addition.

[sweep]
# Overlay chunks run per night, after every as-is chunk, best prior score first (the strategy x venue's 365-day
# Sharpe low end); the rest wait for the next night, so a wide grid is walked a slice a night (the run's
# overlay_chunks_waiting / max_chunks is the nights left). An overlay series holding an open shadow account reruns
# outside this cap. The memory budget (ANALYZE_MEMORY_GB) applies as for any chunk.
max_chunks = 100

[overlays.slots]
max_open_trades = [1, 5]

[overlays.stake]
stake_amount = [100]

[overlays.stop]
stoploss = [-0.05, -0.15]

[overlays.majors]
pairs = [3]

# Fewer pairs, fewer slots: concentrated books whose returns move less with the venue's whole whitelist.
[overlays.focus]
max_open_trades = [1, 3]
pairs = [3, 5]

# Stops from tight to loose, beside the strategy's own exit logic.
[overlays.risk]
stoploss = [-0.03, -0.08, -0.25]

# Take-profit exits: a quick target shortens the hold (the short cohort), each under a tight and a wide stop.
[overlays.exits]
take = [{ minimal_roi = { "0" = 0.01 } }, { minimal_roi = { "0" = 0.03 } }, { minimal_roi = { "0" = 0.08 } }]
stoploss = [-0.05, -0.10]

# No take-profit (a 1000% target never fills): the strategy's exit signal or the stop closes, which lengthens the hold
# (the long cohort).
[overlays.ride]
ride = { minimal_roi = { "0" = 10 } }
stoploss = [-0.10, -0.20]
