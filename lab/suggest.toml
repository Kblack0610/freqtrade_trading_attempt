# Thresholds for lab/suggest.py. Each suggestion stores the value it saw next to the threshold it was held to,
# so the site can show why. Change a number here, rerun `python lab/suggest.py`, and the Suggestions page follows.

[promote]
# The trailing backtest window every gate reads.
window = "365d"
# Enough closed trades that the intervals mean something.
min_trades = 30
# The low end of the 90% block-bootstrap interval on mean profit per trade must clear this.
expectancy_lo_above = 0.0
# The low end of the 90% interval on the annualized Sharpe must clear this.
sharpe_lo_above = 0.0
# Deflated Sharpe: the chance the Sharpe beats the best one luck gives among every strategy tested.
min_dsr = 0.90
# Calendar years with at least min_year_days of returns count; this share of them must be profitable.
min_years = 2
min_year_days = 180
min_years_profitable = 0.70
# Largest peak-to-trough fall allowed in the window, as a fraction.
max_drawdown = 0.35
# A candidate whose daily returns track a strategy already in the league adds little.
max_rho = 0.70
# An edge on one thin book can be that book's quirk: the expectancy and trades gates above must hold on this
# many venues, counting the one promoted.
min_venues = 2
# Probability of backtest overfitting on the venue in the window: the share of in-sample halves whose best
# strategy lands below the median on the other half. Above 0.5, picking the best backtest there is worse than chance.
max_pbo = 0.5

[watch]
# Near misses: loadable, lookahead-clean candidates that fail this many promote gates or fewer.
max_failed_gates = 1
# How many to show, best Sharpe interval first.
limit = 12

[demote]
# A league bot is demoted when its own dry run has lost money over this many days with enough trades,
live_days = 60
min_live_trades = 20
# or when every backtest of its strategy on that exchange (or on every research exchange, for one with no
# history such as kraken) has the high end of its expectancy interval below zero, with enough trades.
window = "365d"
min_trades = 30

[lockbox]
# Months from this day on stay out of walk-forward, scoring and the book. A strategy that clears everything
# else gets one look: move this date by PR, with a migration adding that look to `trials` (see README).
start = 2026-05-01

[retune]
# From lab/walkforward.py: hyperopt tunes on the months before each test month, which it never sees.
# The tuned parameters must beat the strategy as it is on each of the newest this-many months,
folds = 2
# each with at least this many tuned trades in the month,
min_fold_trades = 5
# Pooled over every month, the low end of the 90% bootstrap interval of the tuned minus the untuned
# per-trade expectancy must clear this (a month or two of luck in the tuner's favour is not a gain),
min_gain = 0.0
# over at least this many tuned trades, and the low end of the tuned expectancy's own interval must clear this.
min_trades = 30
min_oos_expectancy = 0.0

[confidence]
# Whether a strategy has earned real money, from lab/confidence.py. Stricter than [promote], which only decides
# who enters the dry-run league. No literature sets these numbers; each one is a judgment call.
# Every gate here passes and the score reaches this, or the strategy is not ready.
ready_score = 90
# The window the whole-history gates read.
window = "all"
# The empirical-Bayes prior needs this many strategies with at least this many out-of-sample trades. Six gave
# scores near 100 on the 2026-11-05 data: too few to estimate a spread, so almost nothing shrank.
min_population = 20
min_member_trades = 30
# Pooled tuned walk-forward trades: detects 0.2 SD per trade at z = 3.14, Bonferroni over about 56 tests.
min_oos_trades = 250
# The low end of this block-bootstrap interval on out-of-sample expectancy must clear zero.
expectancy_level = 0.95
# Deflated Sharpe on daily net returns, with the trial count from the register.
min_dsr = 0.95
# Probability of backtest overfitting on the venue. 0.5 is the convention; this is tighter on purpose.
max_pbo = 0.25
# Minimum backtest length (Bailey et al 2014, theorem 3.1): the out-of-sample years must reach this multiple of
# 2 ln(N) / SR^2, N the trial register's size and SR the annualized Sharpe of those out-of-sample days. 1 is the
# paper's bound, a necessary condition only; N counts every trial, not independent ones, so it is the stricter side.
min_btl_ratio = 1.0
# Walk-forward months: at least this many, and this share of them with a positive expectancy.
min_folds = 6
min_folds_positive = 0.70
# BTC trend buckets: up or down when the close is this far from its 200-day mean, flat between. Each needs
# enough days to count, at most this many may lose, and no bucket may earn over this share of the profit.
trend_band = 0.05
# Volatility terciles come from the volatility seen so far; a day has no bucket before this many days of it.
vol_min_days = 90
min_regime_days = 30
max_negative_regimes = 1
max_regime_share = 0.60
# The low end of the 90% interval on the annual return over holding the same share of BTC.
hold_excess_lo_above = 0.0
# The deepest any trade may go against its entry. strategies holds no stoploss to compare with, so this is flat.
max_open_loss = 0.25
# fee_per_trade must sit this close to twice the venue's configured fee, or the rows predate the real fees.
fee_tolerance = 0.20
# Out-of-sample expectancy must stay positive with only this share of the edge before fees.
stress_gross_share = 0.5
# Additional round-trip execution costs; every point must leave the OOS interval's low end above zero.
slippage_sweep = [0.001, 0.002, 0.004]
# Replay each tuned test month with these execution and parameter perturbations, without retuning.
entry_delay_candles = 1
parameter_nudge_fraction = 0.10
detail_timeframe = "1m"
# Positive out of sample on this many venues, so an edge is not one venue's fee or data.
min_venues_agreeing = 2
# Anytime-valid paper gates (docs/anytime-gates.md, option a): confidence sequences read after every closed trade, so
# the nightly read costs no false passes. This is the league-wide false pass rate; each live bot's sequences get
# alpha / (bots live now), Bonferroni. Fixed before any paper result is read; no result moves it.
anytime_alpha = 0.05
# Drift passes when its gap sequence sits inside the expectancy interval's half width; the gap per trade is clipped
# to +- this (a gap beyond 10 points is a mismatched exit, not a fill difference). Dry run passes when the paper expectancy sequence's low end is above zero; a trade's return is clipped
# to these bounds (the widest stop is -0.30).
drift_bound = 0.10
live_return_bounds = [-0.30, 0.30]
# The behaviour a backtest cannot give stays as a floor: this long, through a BTC fall this deep, with a real stop.
min_live_days = 30
min_live_btc_drop = 0.10
min_live_stopouts = 1
# Retire on decay, apart from the hard stop: a CUSUM over live trades against the out-of-sample low end alarms at
# ln of this. If the edge is at least that low end, one false alarm takes this many live trades on average.
decay_false_alarm_trades = 1000

[book]
# What a scored strategy might return, from lab/book.py. Paths resample runs of this many months.
horizon_months = [12, 60]
block_months = 3
# Down this share of capital from peak: exit everything and stay stopped. The day limit is [watcher] day_loss.
hard_stop = 0.15
# Guesses until there is a quote: a small VPS for a fixed exit IP, and a CPA once before Stage 1.
vps_per_month = 6.0
cpa_once = 500.0
# The plain alternatives on /book. Fee per side is Kraken's entry maker tier. Tax rates are guesses at a
# middle US bracket, short and long term, until a CPA says otherwise: they are not tax advice.
benchmark_years = [1, 3, 5]
benchmark_fee = 0.004
trend_days = 200
tax_short = 0.24
tax_long = 0.15
# What cash earns, the hurdle under everything on /book: the 1-year Treasury near 4.4% on 2026-11-04, read from
# secondary sources. Refresh it by hand; a projection holds it flat, which no real rate does.
tbill_yield = 0.044

# Proposed in the plan, set by the human. Paper only: lab/league.py refuses real money whatever this says.
[[book.stages]]
name = "Stage 1"
capital = 500.0
stake = 50.0
max_open = 3

[[book.stages]]
name = "Stage 2, first step"
capital = 1000.0
stake = 100.0
max_open = 3

[[book.stages]]
name = "Stage 2, second step"
capital = 2000.0
stake = 200.0
max_open = 3

[volatility]
# From lab/volatility.py: a day's realized variance is the sum of its squared candle log returns at this timeframe,
# kept when it has at least this share of its candles.
timeframe = "5m"
min_day_share = 0.9
# HAR's terms: log mean variance over the last 1, 7 and 30 days (crypto trades every day, so a week is 7).
har_days = [1, 7, 30]
# What HAR has to beat: the mean of the last this-many days, and an EWMA with this decay (RiskMetrics' 0.94).
baseline_days = 30
ewma_lambda = 0.94
# HAR is refit each month on every day before it, and a month is scored only with at least this many.
min_train_days = 365
# HAR wins on a venue when the high end of this block-bootstrap interval on the daily QLIKE difference, HAR minus
# baseline, is below zero against each baseline. Blocks of days, since volatility clusters.
level = 0.95
block_days = 10
# Research sizing only: annualized per-pair volatility target, no borrowed exposure. A month must have this many
# previously scored days with HAR beating both baselines; until then its HAR sleeve holds cash.
target_annual = 0.20
target_max_scale = 1.0
target_min_score_days = 90

[live]
# What lab/live.py would run. Nothing deploys it, and its guard is on. Stake and slots come from this stage.
stage = "Stage 1"
# Both keep a stop on the exchange through an outage; coinbase cannot, and okx and kucoin are research venues.
venues = ["binanceus", "kraken"]
# Over $1M traded in 24 hours on both venues, measured 2026-11-05. Binance.US ADA was $156k and DOT $4k.
pairs = ["BTC/USD", "ETH/USD", "SOL/USD", "XRP/USD"]

[live.order_types]
entry = "limit"
exit = "limit"
emergency_exit = "market"
stoploss = "limit"
stoploss_on_exchange = true
stoploss_on_exchange_interval = 60

[watcher]
# One pass over every bot. A bot has no equity event, so this is a poll.
cadence_seconds = 60
# Equity down this share of capital since the UTC day's first reading. Alert only at Stage 0.
day_loss = 0.03

[markouts]
# lab/markouts.py: each paper entry's move this many minutes after its fill, hedged by the pair's BTC beta over the
# beta_days before, against `draws` random entries on the same pair and side within window_hours. A diagnostic only.
timeframe = "5m"
horizons_minutes = [5, 60, 240]
window_hours = 24
draws = 20
beta_days = 30

[horizon]
# lab/horizon.py: a strategy's out-of-sample days against hold BTC and the long-mean filter, shown on /book.
level = 0.90
min_days = 60
block = 10

[scorecard]
# lab/scorecard.py: the out-of-sample result per market climate shown on /book. A climate is the BTC trend bucket
# ([confidence] trend_band) and the volatility tercile of the day before. Under min_days days a cell gets no interval.
level = 0.90
min_days = 30
block = 10

[mixtures]
# lab/mixtures.py: strategies run together, fit on past walk-forward months and scored on the next. Every spec
# scored is a `trials` row, so a bigger search raises the deflated Sharpe bar. Judgment calls, not evidence.
# Which walk-forward return a sleeve is: tuned (hyperopt's parameters on months it never saw) or base.
variant = "tuned"
# The pool: the best-scored pairs on /confidence, then the rest by name, with more months than training needs.
pool = 8
max_sleeves = 3
weightings = ["equal", "inverse_vol", "hrp"]
gates = [false, true]
# Most specs scored a run, the 1/N baseline first. The order is fixed, so a run with the same pool adds no trials.
budget = 120
# Months of a sleeve's out-of-sample returns before its first sized month.
min_train_months = 2
# The regime gate turns a sleeve on in a climate where its training mean was positive over at least this many days.
gate_min_days = 10
level = 0.90
block = 10
pbo_blocks = 8
# Mixtures listed on /book, best interval low end first, after the baseline.
show = 10

[diversity]
# lab/diversity.py: the diversity archive behind /coverage and the diverse cohort (docs/strategy-coverage.md,
# Diversity). A cell is family x holding period x climate x venue x trade frequency; its elite is the strategy with
# the highest low end of the Sharpe interval in `window`. The families left out are the strategies cohort's
# skip_families (lab/cohorts.toml). Judgment calls, not evidence.
window = "365d"
min_trades = 30
# Holding-period bucket edges in hours of the median trade: under 1 h, 1 h to 1 day, 1 to 7 days, over 7 days.
hold_hours = [1, 24, 168]
# Trade frequency is cut into this many equal-count buckets across the archive's strategies.
freq_buckets = 3
# Two strategies whose daily returns correlate above this are one, whatever cells they sit in.
max_rho = 0.5
# The strategy card's haircut: per-trade expectancy again with every win cut to this share of its size, since a
# backtest's wins tend to shrink out of sample (tr-211 review, payoff ratio beside win rate). Judgment, not evidence.
payoff_haircut = 0.5

[calibration]
# lab/calibration.py: the real analysis, walk-forward and confidence code on seeded synthetic candles, to measure each
# gate's false pass rate (strategies with no edge) and power (strategies with a planted one). Every planted number is
# a choice for the experiment, not a fact about crypto; the table says only whether the gates find a clean edge.
# One synthetic venue with the first venue's fees and these pairs, each its own hourly path.
pairs = ["BTC/USD", "ETH/USD", "SOL/USD"]
# The calibration table reads the newest this-many test months of each strategy, so one run gives each length.
oos_months = [12, 60]
# Hourly returns: GARCH(1,1) with Student-t innovations (volatility clustering and fat tails) at this annual volatility.
annual_vol = 0.60
garch_alpha = 0.05
garch_beta = 0.93
tail_df = 4
# The planted component: an AR(1) signal (an Ornstein-Uhlenbeck process sampled hourly) with this lag-1 correlation,
# carried in the candle volume, whose correlation with the next hour's standardized return is signal_ic.
signal_phi = 0.90
signal_ic = 0.04
# Each planted strategy reads the signal mixed with its own noise, so its correlation with the next return (its edge)
# is one of these; a null reads only noise, so it enters at random times and is tuned like any other strategy.
edges = [0.01, 0.02, 0.04]
per_edge = 4
nulls = 8

[shadow]
# lab/shadow.py: shadow paper accounts, database rows with paper capital and no pod, promoted, marked and retired
# nightly by the rule below (docs/pipeline.md, Shadow accounts). Judgment calls, not evidence.
capital = 1000
# The backtest window the entry and the diversity pick read.
window = "365d"
# Entry: enough trades in the backtest window and out of sample that the edges mean something, and both above zero:
# the low end of the backtest expectancy interval and the walk-forward mean profit per trade (confidence).
min_backtest_trades = 30
expectancy_lo_above = 0.0
min_oos_trades = 30
oos_expectancy_above = 0.0
# Two strategies whose BTC-residual daily returns correlate above this are one; a cohort holds only one of them.
max_rho = 0.5
# A median trade held under this many hours is the short cohort, otherwise long ([diversity] hold_hours' middle edge).
hold_edge_hours = 24
# The block-bootstrap interval on the mean daily return: blocks of this many days, at this level.
block = 10
level = 0.90

[shadow.short]
# Open accounts at once; judged after min_days, retired at max_days unless winning, or past max_drawdown any day.
max_active = 60
min_days = 30
max_days = 60
max_drawdown = 0.20

[shadow.long]
max_active = 60
min_days = 90
max_days = 180
max_drawdown = 0.30
