# Thresholds for lab/suggest.py. Each suggestion stores the value it saw next to the threshold it was held to,
# so the site can show why. Change a number here, rerun `python lab/suggest.py`, and the Suggestions page follows.

[promote]
# The trailing backtest window every gate reads.
window = "365d"
# Enough closed trades that the intervals mean something.
min_trades = 30
# The low end of the 90% block-bootstrap interval on mean profit per trade must clear this.
expectancy_lo_above = 0.0
# The low end of the 90% interval on the annualized Sharpe must clear this.
sharpe_lo_above = 0.0
# Deflated Sharpe: the chance the Sharpe beats the best one luck gives among every strategy tested.
min_dsr = 0.90
# Calendar years with at least min_year_days of returns count; this share of them must be profitable.
min_years = 2
min_year_days = 180
min_years_profitable = 0.70
# Largest peak-to-trough fall allowed in the window, as a fraction.
max_drawdown = 0.35
# A candidate whose daily returns track a strategy already in the league adds little.
max_rho = 0.70
# An edge on one thin book can be that book's quirk: the expectancy and trades gates above must hold on this
# many venues, counting the one promoted.
min_venues = 2
# Probability of backtest overfitting on the venue in the window: the share of in-sample halves whose best
# strategy lands below the median on the other half. Above 0.5, picking the best backtest there is worse than chance.
max_pbo = 0.5

[watch]
# Near misses: loadable, lookahead-clean candidates that fail this many promote gates or fewer.
max_failed_gates = 1
# How many to show, best Sharpe interval first.
limit = 12

[demote]
# A league bot is demoted when its own dry run has lost money over this many days with enough trades,
live_days = 60
min_live_trades = 20
# or when every backtest of its strategy on that exchange (or on every research exchange, for one with no
# history such as kraken) has the high end of its expectancy interval below zero, with enough trades.
window = "365d"
min_trades = 30

[retune]
# From lab/walkforward.py: hyperopt tunes on the months before each test month, which it never sees.
# The tuned parameters must beat the strategy as it is on each of the newest this-many months,
folds = 2
# each with at least this many tuned trades in the month,
min_fold_trades = 5
# Pooled over every month, the low end of the 90% bootstrap interval of the tuned minus the untuned
# per-trade expectancy must clear this (a month or two of luck in the tuner's favour is not a gain),
min_gain = 0.0
# over at least this many tuned trades, and the low end of the tuned expectancy's own interval must clear this.
min_trades = 30
min_oos_expectancy = 0.0

[confidence]
# Whether a strategy has earned real money, from lab/confidence.py. Stricter than [promote], which only decides
# who enters the dry-run league. No literature sets these numbers; each one is a judgment call.
# Every gate here passes and the score reaches this, or the strategy is not ready.
ready_score = 90
# The window the whole-history gates read.
window = "all"
# The empirical-Bayes prior needs this many strategies with at least this many out-of-sample trades. Six gave
# scores near 100 on the 2026-11-05 data: too few to estimate a spread, so almost nothing shrank.
min_population = 20
min_member_trades = 30
# Pooled tuned walk-forward trades: detects 0.2 SD per trade at z = 3.14, Bonferroni over about 56 tests.
min_oos_trades = 250
# The low end of this block-bootstrap interval on out-of-sample expectancy must clear zero.
expectancy_level = 0.95
# Deflated Sharpe on daily net returns, with the trial count from the register.
min_dsr = 0.95
# Probability of backtest overfitting on the venue. 0.5 is the convention; this is tighter on purpose.
max_pbo = 0.25
# Walk-forward months: at least this many, and this share of them with a positive expectancy.
min_folds = 6
min_folds_positive = 0.70
# BTC trend buckets: up or down when the close is this far from its 200-day mean, flat between. Each needs
# enough days to count, at most this many may lose, and no bucket may earn over this share of the profit.
trend_band = 0.05
min_regime_days = 30
max_negative_regimes = 1
max_regime_share = 0.60
# The low end of the 90% interval on the annual return over holding the same share of BTC.
hold_excess_lo_above = 0.0
# The deepest any trade may go against its entry. strategies holds no stoploss to compare with, so this is flat.
max_open_loss = 0.25
# fee_per_trade must sit this close to twice the venue's configured fee, or the rows predate the real fees.
fee_tolerance = 0.20
# Out-of-sample expectancy must stay positive with only this share of the edge before fees.
stress_gross_share = 0.5
# Dry run against backtest: enough matched trades, and the mean gap inside the expectancy interval's half width.
min_drift_trades = 20
# A dry run tests behaviour, not edge: this long, this many trades, through a BTC fall this deep, with real stops.
min_live_days = 90
min_live_trades = 60
min_live_btc_drop = 0.10
min_live_stopouts = 1

[watcher]
# One pass over every bot. A bot has no equity event, so this is a poll.
cadence_seconds = 60
# Equity down this share of capital since the UTC day's first reading. Alert only at Stage 0.
day_loss = 0.03
