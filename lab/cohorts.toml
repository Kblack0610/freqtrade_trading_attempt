# Dry-run cohorts the lab picks the roster rows of (lab/cohorts.py). A cohort is a league label on the overview;
# a roster row carries it (README, Cohorts). Everything here is paper: lab/league.py refuses anything else.

[aggressive]
# The top `top` strategies by the low end of the Sharpe interval in `window`, each run under its best setup overlay
# (lab/variants.toml) on every venue in `venues`. The promote gates are ignored on purpose: this cohort forward-tests
# near-misses. Every backtest it picks from is a counted trial in the register, so the search it came from still
# raises the deflated-Sharpe bar for everything.
top = 4
window = "365d"
# The score is the mean low end over these venues, and a strategy needs trades on every one. Cheap venues only:
# coinbase fees end almost every backtest in ruin, and kraken has no backtest history (README, Troubleshooting).
rank_venues = ["binanceus"]
min_trades = 30
# Where the bots run. Grow this or `top` only by a human decision: a wrong row costs a PVC.
venues = ["binanceus", "coinbase", "kraken"]

[mixture]
# The sleeves of the best mixture lab/mixtures.py scored out of sample (lab/suggest.toml [mixtures]), by the low end
# of its interval, one bot per sleeve on its own exchange. Only a mixture the bots run as scored qualifies: every bot
# gets the same wallet and trades every day, so the weighting is 1/N and there is no regime gate. Each sleeve runs
# the strategy with its own parameters (base overlay); the tuned ones stay in the backtest. Every mixture is a trial.
kind = "mixture"
weighting = "equal"
gated = false
# Days of out-of-sample return a mixture needs before it can be picked: about three scored months.
min_days = 90

[strategies]
# Every strategy in dry run: each loadable, lookahead-clean strategy outside `skip_families` (lab/families.toml), one
# bot per strategy on each venue in `venues`, under its own settings (base overlay). Cost and the reasons for one
# venue: docs/strategy-coverage.md. Dry run adds no backtest trial; it measures what the backtest leaves out (fills,
# fees, live candles: the drift table). A strategy file added to the repo is a trial whether or not a bot runs it.
kind = "all"
venues = ["binanceus"]
skip_families = ["template", "exit-example", "biased-control", "short"]

[strategies.budget]
# OHLCV calls a minute the cohort may make on a venue: one per pair per new candle, summed over its bots. binanceus
# allows 1200 request weight a minute per IP and a klines call weighs 2, so 600 calls; this is half, leaving the rest
# to the other cohorts and the backfill job, which share the cluster's one address. A pick over budget fails.
binanceus = 300

[diverse]
# One bot per different way of making money: the elite of each filled cell of the diversity archive (lab/diversity.py,
# docs/strategy-coverage.md, Diversity) among strategies on `venues` at `min_timeframe` or slower, taken best low end
# first while its daily returns stay within [diversity] max_rho of those taken, until `max_bots`. Base overlay. The
# promote gates are ignored, as for aggressive. Grow `max_bots` only by a human decision: each bot is about 320 MiB.
kind = "archive"
# binanceus only: coinbase fees end almost every backtest in ruin and kraken has no backtest history (aggressive).
venues = ["binanceus"]
# 1 h or slower keeps 16 bots on 10 pairs at about 3 candle calls a minute; on 5m they would make 32.
min_timeframe = "1h"
max_bots = 16

[diverse.budget]
# Candle calls a minute, as [strategies.budget]: the strategies cohort holds 300 of binanceus' 600, so this is a small
# slice of the rest. A pick over it fails.
binanceus = 10
