[inputs.nws_obs]
title = "What a station has measured so far today"
signal_source = "observation"
origin = "api.weather.gov station observations"
cadence = "hourly"
reader = "lab/nws.py"
# Read hourly with nws_high (home-config trader-inputs-nws); three missed reads is stale. A reading is the station's
# local standard day so far: {day, high, low, rained, n, last}. The same shape is backfilled from the IEM ASOS archive
# (`python -m lab.nws backfill`), one reading per observation, so a backtest window exists for every month the archive holds.
fresh_min = 180
# A reading counts as known this long after its observation, the lag between an ASOS report and the NWS API serving it.
lag_min = 10

[inputs.nws_cli]
title = "The NWS daily climate report of a station"
signal_source = "observation"
origin = "NWS climate report (CLI), parsed by IEM"
cadence = "daily"
reader = "lab/nws.py"
# A reading's as_of is its day's end, and lab/nws.py reads it FINAL_H (12 h) later at the next hourly run. The
# stations' day ends fall up to 21 h apart (UTC-5 to UTC-8), so a healthy reader's newest reading reaches 34 h every
# day (test_inputs.py checks it); 35 h is a report due an hour ago that no run wrote.
fresh_min = 2100

[inputs.nws_cli.api]
# Iowa Environmental Mesonet (IEM), mesonet.agron.iastate.edu: the ASOS archive and the NWS CLI reports as JSON, free
# and keyless. IEM publishes no number for this endpoint; its help page asks for a polite request rate and bulk pulls
# in one request per station and span (read 2026-11-17, https://mesonet.agron.iastate.edu/request/download.phtml).
# A daily read is one request a station, 23 a day; a backfill is one request a station and month.
base_url = "https://mesonet.agron.iastate.edu"
budget_rps = 1
page_gap_s = 1.0
retries = 4
timeout_s = 60
user_agent = "trader-lab (github.com/Kblack0610/freqtrade_trading_attempt)"

[inputs.daily_close]
title = "A stock's split- and dividend-adjusted daily close"
signal_source = "price"
origin = "alpaca daily bars"
cadence = "each session"

[inputs.stock_bid]
