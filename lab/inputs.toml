# The inputs registry (lab/inputs.py): every input a strategy reads, by the name the decision record writes it under.
# A family declares the inputs it reads (lab/markets/families.py Family.INPUTS) and a crypto strategy lists them in
# lab/families.toml [strategies] `inputs`; both must name an entry here (lab/taxonomy.py). Adding a data source is one
# entry here, one reader writing input_readings (migration 056) and one family that reads it.
#
# Each entry: title; signal_source, one of lab/families.toml [signal_sources]; origin, where the value comes from
# ({venue} is the venue it was read on), as decisions.inputs[].source shows it; cadence, how often it changes.
# An entry with a reader of ours also names it (`reader`) and `fresh_min`, past which its newest reading is stale: the
# recorder lane card and trader_input_age_seconds read that, and a family reading the input refuses an older one.

[inputs.ohlcv]
title = "Candles"
signal_source = "price"
origin = "the exchange's OHLCV, via Freqtrade"
cadence = "each candle"

[inputs.funding]
title = "Funding rates and open interest"
signal_source = "price"
origin = "the exchange's futures API (lab/futures.py)"
cadence = "each funding period"

[inputs.bid]
title = "Best bid of the yes side"
signal_source = "price"
origin = "{venue} recorder"
cadence = "each sweep"

[inputs.ask]
title = "Best ask of the yes side"
signal_source = "price"
origin = "{venue} recorder"
cadence = "each sweep"

[inputs.yes_depth]
title = "Contracts offered at the yes ask"
signal_source = "price"
origin = "{venue} recorder"
cadence = "each sweep"

[inputs.no_depth]
title = "Contracts offered at the no ask"
signal_source = "price"
origin = "{venue} recorder"
cadence = "each sweep"

[inputs.close_time]
title = "When the market closes"
signal_source = "structural"
origin = "{venue} markets"
cadence = "set at listing"

[inputs.head_to_head]
title = "The pair's past final totals against the line"
signal_source = "structural"
origin = "{venue} results"
cadence = "each settled game"

[inputs.no_vig_fair]
title = "The no-vig fair price of the over"
signal_source = "cross-venue"
origin = "{venue} line book"
cadence = "each sweep"

[inputs.nws_high]
title = "NWS forecast high temperature"
signal_source = "forecast"
origin = "api.weather.gov gridpoint forecast"
cadence = "hourly"
reader = "lab/nws.py"
# Read hourly (home-config trader-inputs-nws); three missed reads is stale.
fresh_min = 180

[inputs.nws_high.api]
# lab/markets/api.py's client. api.weather.gov publishes no number: "The rate limit is not public information, but
# allows a generous amount for typical use" (read 2026-11-15, https://www.weather.gov/documentation/services-web-api).
# A read is two requests a station (points, then its forecast), 14 an hour for 7 stations; one a second is far under.
base_url = "https://api.weather.gov"
budget_rps = 1
page_gap_s = 0.5
retries = 4
timeout_s = 30
# The API refuses a request without a User-Agent and asks it to name the application.
user_agent = "trader-lab (github.com/Kblack0610/freqtrade_trading_attempt)"

# The stations Kalshi's daily temperature and rain series settle on: each market's rules name the NWS climate report
# (CLI) of one station, "the maximum temperature recorded at New York City (CLINYC)" (read 2026-11-15 and 2026-11-17
# from each series' open markets on Kalshi's public API; Boston, Oklahoma City, Seattle and San Francisco had no open
# market that day, so their CLI ids are the standard ones, not read). One table for every weather input:
#   code        Kalshi's city code: a low series is KXLOWT<code>, a daily rain market is KXRAIN-<date>-<code>, and
#               KXRAIND<code> is a one-market rain event of the same day.
#   series      the station's daily high series.
#   cli         the climate report the market settles on.
#   lat, lon    the station's; the forecast reader asks NWS for the grid cell that holds them.
#   utc_offset  standard time, in hours: a CLI day is midnight to midnight local STANDARD time all year, so a
#               station's observed day never moves with daylight saving.

[inputs.nws_high.stations.KATL]
code = "ATL"
series = ["KXHIGHTATL"]
cli = "CLIATL"
lat = 33.6301
lon = -84.4418
utc_offset = -5

