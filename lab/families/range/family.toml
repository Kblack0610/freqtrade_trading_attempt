# The range family: buy a close far under its own mean, only while BTC's trend is flat (lab/metrics.trend_buckets,
# band from lab/suggest.toml [confidence] trend_band, read by the generator), and sell back at the mean.
# Long only, spot. lab/families/generate.py writes the strategy files from this file: edit here, then rerun it.
kind = "range"
prefix = "Range"
timeframe = "1h"
# Also the days of BTC 1d candles loaded for the 200-day mean.
startup_candle_count = 200

[exit]
minimal_roi = { "0" = 0.05 }
stoploss = -0.05
time_stop_hours = 48

[strategies.Z24]
window = 24
z_enter = 2.0
z_exit = 0.0

[strategies.Z72]
window = 72
z_enter = 2.0
z_exit = 0.0
